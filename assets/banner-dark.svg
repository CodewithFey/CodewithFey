<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Elif Feyza Güneş">
<style>
  .name { font: 700 54px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #F4EDE5; letter-spacing: -1px; }
  .kicker { font: 600 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #F0956A; letter-spacing: 2.5px; }
  .line { font: 400 21px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #B3A595; }
  .st { font: 600 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #B3A595; }
  .train { animation: ride 18s linear infinite; animation-delay: -5s; }
  @keyframes ride { from { transform: translateX(-140px); } to { transform: translateX(1340px); } }
  @media (prefers-reduced-motion: reduce) { .train { animation: none; transform: translateX(380px); } }
</style>
